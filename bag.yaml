name: github
description: GitHub PR operations — review, comment, clean commits, find repos

bags:
  - github-app

tools:
  entry: tools.ts
  env:
    - BARRY_GITHUB_PAT

tool-metadata:
  - { toolName: pr_review, namespace: github, access: write }
  - { toolName: pr_comment, namespace: github, access: write }
  - { toolName: pr_clean, namespace: github, access: write }
  - { toolName: pr_findpath, namespace: github, access: read }

dependencies:
  - name: gh
    install: brew install gh
    reason: GitHub CLI used by PR skills
